function runeLine(t){let text=String(t||'');const original=text;if(text.includes('アンベッサ基本'))text='征服者 / 打ちこわし / 息継ぎ / 忍耐 / サドンインパクト';const keys=Object.keys(runes),seen=new Set();const add=(n)=>{if(keys.includes(n)&&!seen.has(n)){seen.add(n);return n;}return null;};const ks=new Set(['征服者','エレクトロキュート','不死者の握撃','グラスプ・オブ・ザ・アンダイイング','フリートフットワーク','フェイズラッシュ','エアリー召喚','ねこばば','アフターショック','ガーディアン','エンパワーメント']);const parts=text.split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);let keystone=[],main=[],sub=[];if(ks.has(parts[0]))add(parts[0])&&keystone.push(parts[0]);parts.slice(1).forEach(n=>{n=n.trim();if(!n)return;if(main.length<3)add(n)&&main.push(n);else add(n)&&sub.push(n);});keys.filter(k=>text.includes(k)&&!seen.has(k)).forEach(k=>{if(ks.has(k))keystone.push(k);else if(main.length<3)main.push(k);else sub.push(k);seen.add(k);});if(!keystone.length&&!main.length&&!sub.length)return`<span class="icon-name">${esc(text)}</span>`;const icon=k=>`<div class="icon-item rune-item"><img class="rune-icon" src="${String(runes[k]).startsWith('http')?runes[k]:'https://ddragon.leagueoflegends.com/cdn/img/perk-images/'+runes[k]}" alt="${esc(k)}"><span class="icon-name">${esc(k)}</span></div>`;const group=(l,a,c)=>a.length?`<div class="rune-group ${c}"><div class="rune-group-label">${l}</div><div class="icon-line">${a.map(icon).join('')}</div></div>`:'';return`<div class="rune-layout rune-layout-grouped">${group('キーストーン',keystone,'rune-keystone')}${group('メインルーン',main,'rune-main')}${group('サブルーン',sub,'rune-sub')}<div class="mini-reason">${esc(original)}</div></div>`;}

function profile(c){const cs=(c.unfavorable||'').split(/[、,]/).map(x=>x.trim()).filter(Boolean);return`<div class="card"><div class="champ-header"><div class="champ-icon-wrapper">${champIcon(c,'champ-icon')}</div><div class="header-text"><span class="champ-name">${esc(c.name)}</span><span class="vs-header-text">チャンピオン概要</span></div></div><div class="section-block"><div class="section-title feature">◆ ${esc(c.name)} の特徴</div><div class="tags-container">${(c.types||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="tips-content" style="margin-top:8px">${esc(c.tips)}</div></div><div class="section-block"><div class="section-title matchup">◆ 登録カウンター候補</div><div class="counter-grid">${cs.map(n=>{const x=find(n);return`<div class="counter-card" data-counter="${esc(n)}">${x?champIcon(x):''}<span>${esc(n)}</span></div>`}).join('')}</div></div></div>`;}
function getDetail(an,bn){try{return typeof getStrictMatchupResearchDetail==='function'?getStrictMatchupResearchDetail(an,bn,typeof getMatchupDisposition==='function'?getMatchupDisposition(an,bn):'',typeof getSpecificResearch==='function'?getSpecificResearch(an,bn)||'':''):{};}catch(e){return{};}}
function matchup(a,b){const an=a.name,bn=b.name,tip=(typeof getSpecificResearch==='function'?getSpecificResearch(an,bn):'')||a.tips||'',d=typeof parseDisposition==='function'?parseDisposition(tip):'unknown',det=getDetail(an,bn),spell=det.spell||((an==='アンベッサ')?'フラッシュ＋イグナイト':'');let rune=det.rune||'';if(an==='アンベッサ'&&!rune.includes('/')&&!rune.includes('基本'))rune='アンベッサ基本 / '+rune;const sk=(championSkillMatchups[an]&&championSkillMatchups[an][bn])||championSkillTips[an];return`<div class="card"><div class="champ-header"><div class="champ-icon-wrapper">${champIcon(a,'champ-icon')}</div><div class="header-text"><span class="champ-name">${esc(an)}</span><span class="vs-header-text">${esc(an)} vs ${esc(bn)}</span></div></div><div class="section-block"><div class="section-title matchup">◆ 相性判定</div><div class="matchup-status"><span class="status-badge status-${esc(d)}">${typeof dispositionLabel==='function'?dispositionLabel(d):esc(d)}</span></div></div><div class="section-block"><div class="section-title feature">◆ PICK PHASE</div><div class="pick-grid"><div class="pick-card"><div class="pick-label">ルーン</div>${runeLine(rune)}</div><div class="pick-card"><div class="pick-label">サモナースペル</div><div class="icon-line">${spellLine(spell)}</div><div class="mini-reason">${esc(spell)}</div></div></div></div><div class="section-block"><div class="section-title feature">◆ BUILD</div><div class="build-grid"><div class="build-card"><div class="build-label">START</div>${iconItem(det.firstComponent||'未指定')}</div><div class="build-card"><div class="build-label">1 CORE</div>${iconItem(det.firstCompleted||'未指定')}</div><div class="build-card"><div class="build-label">2 CORE</div>${iconItem(det.secondCore||'状況分岐')}</div></div><div class="mini-reason">${esc(det.reason||'')}</div></div>${sk?`<div class="section-block"><div class="section-title feature">◆ スキル取り・上げ</div>${skillVisual(an,sk.order)}<div class="tips-content" style="margin-top:9px"><strong>対面別判断：</strong>${esc(sk.matchup||sk.detail||'')}</div></div>`:''}<div class="section-block"><div class="section-title matchup">◆ 個別対策</div><div class="tips-content">${tip}</div></div><div class="section-block"><div class="section-title matchup">◆ 絶対にやってはいけないこと</div><div class="tips-content never-do">${esc(det.neverDo||'主要スキルを同時に使い切ってから長期戦を始めない。')}</div></div><div class="section-block"><div class="section-title feature">◆ 実戦判断</div><div class="tips-content"><strong>【苦しい時間帯】</strong><br>${esc(det.difficulty||'')}</div></div><div class="section-block"><div class="section-title feature">◆ 資料監査</div><div class="source-tier"><strong>資料ランク：</strong>${esc(typeof getSourceTier==='function'?getSourceTier(an,bn,tip):'')}</div></div></div>`;}
function render(){const a=find(document.getElementById('myChampSelect').value),b=find(document.getElementById('enemyChampSelect').value),c=document.getElementById('champContainer');if(!a&&!b){c.innerHTML='<div class="empty-hero"><strong>チャンピオンを1体選択</strong><span>相手の先出しを見たら右側だけ入力。特徴とカウンターを確認し、自分のチャンピオンを左側に入れると対面詳細へ切り替わります。</span></div>';return}if(a&&b){if(a.name===b.name){c.innerHTML='<div class="no-result">同じチャンピオン同士は指定できません</div>';return}if(!SELF.includes(a.name)){c.innerHTML=profile(a)+'<div class="profile-note">現在の対面詳細は研究済みチャンピオンを自分側に置く構成です。左側に研究済みチャンピオンを選択してください。</div>';return}c.innerHTML=matchup(a,b);return}const only=a||b;c.innerHTML=profile(only);c.querySelectorAll('.counter-card').forEach(e=>e.onclick=()=>{if(a)document.getElementById('enemyChampSelect').value=e.dataset.counter;else document.getElementById('myChampSelect').value=e.dataset.counter;render();});}
function bind(){const a=document.getElementById('myChampSelect'),b=document.getElementById('enemyChampSelect');a.addEventListener('input',()=>show('myChampSelect','myChampSuggestions',true));a.addEventListener('focus',()=>show('myChampSelect','myChampSuggestions',true));b.addEventListener('input',()=>show('enemyChampSelect','enemyChampSuggestions',false));b.addEventListener('focus',()=>show('enemyChampSelect','enemyChampSuggestions',false));[a,b].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=find(x.value);if(c){x.value=c.name;document.getElementById(x.id==='myChampSelect'?'myChampSuggestions':'enemyChampSuggestions').classList.remove('open');render();}}}));document.addEventListener('click',e=>{if(!e.target.closest('.combo-shell'))document.querySelectorAll('.combo-suggestions').forEach(x=>x.classList.remove('open'));});render();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
})();
</script>

</body>
</html>
