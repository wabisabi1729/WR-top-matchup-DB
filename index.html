};

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function champIcon(c,cl='game-icon'){if(!c)return'';if(c.id==='Zaahen')return'<div class="champ-icon-fallback '+cl+'">ザ</div>';return`<img class="${cl}" src="${D}/img/champion/${c.id}.png" alt="${esc(c.name)}" loading="lazy">`;}
function itemIconUrl(name){const k=Object.keys(items).find(x=>String(name).includes(x));if(k)return `${D}/img/item/${items[k]}.png`;const label=encodeURIComponent(String(name||'').slice(0,2));return `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231e293b'/%3E%3Ctext x='32' y='38' text-anchor='middle' font-size='24' font-weight='900' fill='%23f8fafc'%3E${label}%3C/text%3E%3C/svg%3E`; }
function iconItem(n){const parts=String(n||'').split(/\s*→\s*/).map(x=>x.trim()).filter(Boolean);return`<div class="icon-line item-icon-line">${parts.map((x,i)=>`<div class="icon-item item-stage-icon">${itemIconUrl(x)?`<img class="game-icon" src="${itemIconUrl(x)}" alt="${esc(x)}">`:''}<span class="icon-name">${esc(x)}</span></div>${i<parts.length-1?'<span class="skill-arrow">→</span>':''}`).join('')}</div>`;}
function spellLine(t){const f=Object.keys(spells).filter(k=>String(t).includes(k));return f.length?f.map(k=>`<div class="icon-item"><img class="game-icon" src="${D}/img/spell/${spells[k]}" alt="${k}"><span class="icon-name">${k}</span></div>`).join(''):`<span class="icon-name">${esc(t)}</span>`;}
function runeLine(t){
  let text=String(t||'');
  const original=text;
  const isAmbessaBase=text.includes('アンベッサ基本')||text.includes('征服者 / WR 7.2d基本');
  if(isAmbessaBase) text='征服者 / 打ちこわし / 息継ぎ / 忍耐 / 突然のインパクト';
  const keys=Object.keys(runes);
  const seen=new Set();
  const add=(name)=>{if(keys.includes(name)&&!seen.has(name)){seen.add(name);return name;}return null;};
  let keystone=[];
  let main=[];
  let sub=[];
  const keystoneNames=new Set(['征服者','エレクトロキュート','不死者の握撃','グラスプ・オブ・ザ・アンダイイング','フリートフットワーク','エンパワーメント','フェイズラッシュ','エアリー召喚','ねこばば','アフターショック','ガーディアン','レサージェンス','ハーベスト・アサルト','ファーストストライク','リーサルテンポ','デッドリー・フレイム']);
  const pathMatch=text.match(/^(.*?)\s*\/);
  const rawParts=text.split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);
  const firstName=rawParts[0];
  if(keystoneNames.has(firstName)) add(firstName)&&keystone.push(firstName);
  const mainMatch=text.match(/(?:栄華|不滅|魔道|覇道|天啓|Precision|Resolve|Sorcery|Domination|Inspiration)\s*:\s*([^/]+)/);
  const subMatch=text.match(/(?:サブ|副|Sub)?(?:\s*)?(?:栄華|不滅|魔道|覇道|天啓|Precision|Resolve|Sorcery|Domination|Inspiration)\s*:\s*([^/]+)$/);
  if(mainMatch){
    mainMatch[1].split(/\s*[/,・]+\s*/).forEach(x=>{const n=x.trim();if(n) add(n)&&main.push(n);});
  }
  if(subMatch){
    subMatch[1].split(/\s*[/,・]+\s*/).forEach(x=>{const n=x.trim();if(n) add(n)&&sub.push(n);});
  }
  if(!main.length && !sub.length){
    rawParts.forEach((part,i)=>{
      if(i===0 && keystone.length) return;
      const n=part.replace(/^(?:栄華|不滅|魔道|覇道|天啓|Precision|Resolve|Sorcery|Domination|Inspiration)\s*:\s*/,'').trim();
      if(!n)return;
      if(i<=3) add(n)&&main.push(n); else add(n)&&sub.push(n);
    });
  } else {
    // ラベル付き形式で取りこぼしたルーンは、元の出現順を保って不足枠へ入れる。
    keys.filter(k=>text.includes(k)).forEach(k=>{
      if(seen.has(k))return;
      if(keystoneNames.has(k)) keystone.push(k);
      else if(main.length<3) main.push(k);
      else sub.push(k);
      seen.add(k);
    });
  }
  if(!keystone.length && !main.length && !sub.length)return`<span class="icon-name">${esc(text)}</span>`;
  const icon=(k)=>`<div class="icon-item rune-item"><img class="rune-icon" src="${String(runes[k]).startsWith('http')?runes[k]:'https://ddragon.leagueoflegends.com/cdn/img/perk-images/'+runes[k]}" alt="${esc(k)}"><span class="icon-name">${esc(k)}</span></div>`;
  const group=(label,arr,cls)=>arr.length?`<div class="rune-group ${cls}"><div class="rune-group-label">${label}</div><div class="icon-line">${arr.map(icon).join('')}</div></div>`:'';
  return`<div class="rune-layout rune-layout-grouped">${group('キーストーン',keystone,'rune-keystone')}${group('メインルーン',main,'rune-main')}${group('サブルーン',sub,'rune-sub')}<div class="mini-reason">${esc(original)}</div></div>`;
}
function skillVisual(ch,o){const text=String(o||'');const m=text.match(/Lv1\s*([QWER]).*?Lv2\s*([QWER]).*?Lv3\s*([QWER])/);if(!m)return`<div class="tips-content">${esc(text)}</div>`;const levels=[m[1],m[2],m[3]];return`<div class="skill-order">${levels.map((x,i)=>{const id=skillIds[ch]?.[x];return`<div class="skill-chip"><span class="skill-level">Lv${i+1}</span>${id?`<img class="game-icon" src="${D}/img/spell/${id}.png" alt="${x}">`:''}<span class="skill-letter">${esc(x)}</span></div>${i<2?'<span class="skill-arrow">→</span>':''}`}).join('')}</div>`;}
function find(v){return findChampion(v)}
function list(v,selfOnly){const q=String(v||'').toLowerCase().trim().replace(/[\s　]/g,'');const pool=selfOnly?matchups.filter(c=>SELF.includes(c.name)):matchups.concat(researchOnlyMatchups);return(q?pool.filter(c=>c.name.toLowerCase().replace(/[\s　]/g,'').includes(q)||String(c.kana||'').replace(/[\s　]/g,'').includes(q)):pool).slice(0,30);}
function show(inputId,boxId,selfOnly){const i=document.getElementById(inputId),b=document.getElementById(boxId);b.innerHTML=list(i.value,selfOnly).map(c=>`<div class="combo-item" data-name="${esc(c.name)}">${champIcon(c)}<span class="combo-name">${esc(c.name)}</span><span class="combo-kana">${esc(c.kana)}</span></div>`).join('')||'<div class="combo-item"><span class="combo-kana">該当なし</span></div>';b.classList.add('open');b.querySelectorAll('[data-name]').forEach(e=>e.onclick=()=>{i.value=e.dataset.name;b.classList.remove('open');render();});}
window.clearComboInput=function(id,bid){document.getElementById(id).value='';document.getElementById(bid).classList.remove('open');render();document.getElementById(id).focus();};
function profile(c){const cs=(c.unfavorable||'').split(/[、,]/).map(x=>x.trim()).filter(Boolean);return`<div class="card"><div class="champ-header"><div class="champ-icon-wrapper">${champIcon(c,'champ-icon')}</div><div class="header-text"><span class="champ-name">${esc(c.name)}</span><span class="vs-header-text">チャンピオン概要</span></div><a class="mobafire-trans-btn" href="${getMobafireTransUrl(c.id)}" target="_blank">📖 MOBAFire</a></div><div class="section-block"><div class="section-title feature">◆ ${esc(c.name)} の特徴</div><div class="tags-container">${(c.types||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="tips-content" style="margin-top:8px">${esc(c.tips)}</div></div><div class="section-block"><div class="section-title matchup">◆ 登録カウンター候補</div><div class="counter-grid">${cs.map(n=>{const x=find(n);return`<div class="counter-card" data-counter="${esc(n)}">${x?champIcon(x):''}<span>${esc(n)}</span></div>`}).join('')}</div><div class="profile-note" style="margin-top:9px">登録済みのカウンター候補。クリックすると、そのまま対面検索へ進みます。</div></div></div>`;}
function matchup(a,b){const an=a.name,bn=b.name,tip=getSpecificResearch(an,bn)||a.tips,d=parseDisposition(tip),st=getStageData(an,bn),det=getStrictMatchupResearchDetail(an,bn,d,tip),sk=(championSkillMatchups[an]&&championSkillMatchups[an][bn])||championSkillTips[an],spell=det.spell||getChampionSpellTip(an,bn)||(an==='アンベッサ'?'フラッシュ＋イグナイト':'');if(an==='アンベッサ' && det.rune && !String(det.rune).includes('/')) det.rune='アンベッサ基本 / '+det.rune;return`<div class="card"><div class="champ-header"><div class="champ-icon-wrapper">${champIcon(a,'champ-icon')}</div><div class="header-text"><span class="champ-name">${esc(an)}</span><span class="vs-header-text">${esc(an)} vs ${esc(bn)}</span></div><a class="mobafire-trans-btn" href="${getMobafireTransUrl(a.id)}" target="_blank">📖 MOBAFire</a></div><div class="section-block"><div class="section-title matchup">◆ 相性判定</div><div class="matchup-status"><span class="status-badge status-${d}">${dispositionLabel(d)}</span></div></div><div class="section-block"><div class="section-title feature">◆ PICK PHASE</div><div class="pick-grid"><div class="pick-card"><div class="pick-label">ルーン</div>${runeLine(det.rune||'')}</div><div class="pick-card"><div class="pick-label">サモナースペル</div><div class="icon-line">${spellLine(spell)}</div><div class="mini-reason">${esc(spell.replace(/<br>/g,' '))}</div></div></div></div><div class="section-block"><div class="section-title feature">◆ BUILD</div><div class="build-grid"><div class="build-card"><div class="build-label">START</div>${iconItem(st.firstPurchase||'未指定')}</div><div class="build-card"><div class="build-label">1 CORE</div>${iconItem(st.firstCore||'未指定')}</div><div class="build-card"><div class="build-label">2 CORE</div>${iconItem(st.secondCore||'状況分岐')}</div></div><div class="mini-reason">${esc(st.reason||det.reason||'')}</div></div>${sk?`<div class="section-block"><div class="section-title feature">◆ スキル取り・上げ</div>${skillVisual(an,sk.order)}<div class="mini-reason">${esc(sk.order||'')}</div><div class="tips-content" style="margin-top:9px"><strong>対面別判断：</strong>${esc(sk.matchup||sk.detail||'')}</div></div>`:''}<div class="section-block"><div class="section-title matchup">◆ 個別対策</div><div class="tips-content">${tip}</div></div><div class="section-block"><div class="section-title matchup">◆ 絶対にやってはいけないこと</div><div class="tips-content never-do">${neverDoText(an,bn,d,tip)}</div></div><div class="section-block"><div class="section-title feature">◆ 実戦判断</div><div class="tips-content"><strong>【苦しい時間帯】</strong><br>${esc(det.difficulty)}<br><br><strong>【相手の勝ち筋】</strong><br>${esc(det.enemyWin)}<br><br><strong>【ダメージトレード】</strong><br>${esc(det.trade)}</div></div><div class="section-block"><div class="section-title feature">◆ 資料監査</div><div class="source-tier"><strong>資料ランク：</strong>${esc(getSourceTier(an,bn,tip))}<br>${esc(matchupSourceAudit[an]||'')}</div></div></div>`;}
function render(){const a=find(document.getElementById('myChampSelect').value),b=find(document.getElementById('enemyChampSelect').value),c=document.getElementById('champContainer');if(!a&&!b){c.innerHTML='<div class="empty-hero"><strong>チャンピオンを1体選択</strong><span>相手の先出しを見たら右側だけ入力。特徴とカウンターを確認し、自分のチャンピオンを左側に入れると対面詳細へ切り替わります。</span></div>';return}if(a&&b){if(a.name===b.name){c.innerHTML='<div class="no-result">同じチャンピオン同士は指定できません</div>';return}if(!SELF.includes(a.name)){c.innerHTML=profile(a)+'<div class="profile-note">現在の対面詳細は研究済み7体を自分側に置く構成です。左側に研究済み7体を選択してください。</div>';return}c.innerHTML=matchup(a,b);return}const only=a||b;c.innerHTML=profile(only);c.querySelectorAll('.counter-card').forEach(e=>e.onclick=()=>{if(a){document.getElementById('enemyChampSelect').value=e.dataset.counter;}else{document.getElementById('myChampSelect').value=e.dataset.counter;}render();});}
function bind(){const a=document.getElementById('myChampSelect'),b=document.getElementById('enemyChampSelect');a.oninput=()=>show('myChampSelect','myChampSuggestions',true);a.onfocus=()=>show('myChampSelect','myChampSuggestions',true);b.oninput=()=>show('enemyChampSelect','enemyChampSuggestions',false);b.onfocus=()=>show('enemyChampSelect','enemyChampSuggestions',false);[a,b].forEach(x=>x.onkeydown=e=>{if(e.key==='Enter'){const c=find(x.value);if(c){x.value=c.name;render();}}});document.addEventListener('click',e=>{if(!e.target.closest('.combo-shell'))document.querySelectorAll('.combo-suggestions').forEach(x=>x.classList.remove('open'));});render();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
})();</script>
